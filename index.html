<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>জ্ঞান.com</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- সরাসরি মূল পোর্টাল লোড হবে, কোনো অফলাইন স্ক্রিন ব্লকার থাকবে না -->
  <iframe id="mainAppFrame" src="https://gyanexam.xyz" allow="autoplay; fullscreen; camera; microphone; display-capture; clipboard-read; clipboard-write; encrypted-media"></iframe>

  <script>
    // সার্ভিস ওয়ার্কার সক্রিয়করণ
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./onesignalsdworkar.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
