<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>জ্ঞান.com</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- সরাসরি লাইভ সার্ভার আইফ্রেম -->
  <iframe 
    id="mainAppFrame" 
    src="https://myserver.tailca4b66.ts.net" 
    allow="camera; microphone; fullscreen; clipboard-read; clipboard-write">
  </iframe>

  <script>
    // পুরোনো কোনো সার্ভিস ওয়ার্কার ক্যাশ থাকলে তা সম্পূর্ণ মুছে ফেলবে
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</body>
</html>
